[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simatic-s7-classic-mcp"
version = "2.0.0"
description = "Production-grade Siemens SIMATIC STEP 7 Classic (V5.x) MCP Server for VS Code, Google Antigravity, OpenAI Codex, and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["siemens", "simatic", "step7", "s7-300", "s7-400", "plc", "mcp", "plcsim", "iec-61131-3"]
dependencies = [
    "mcp>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
windows = [
    "pywinauto>=0.6.8",
    "pywin32>=306",
]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
]

[project.scripts]
simatic-s7-mcp = "simatic_s7_mcp_server:main"

[tool.setuptools]
py-modules = ["simatic_s7_mcp_server", "lad_converter"]
packages = ["simatic_s7_mcp"]
